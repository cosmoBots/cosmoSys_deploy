name: Optional client unit tests
on:
  pull_request:
    paths: ['clients/**', 'services/**', '.github/workflows/optional-clients.yml']
  push:
    paths: ['clients/**', 'services/**', '.github/workflows/optional-clients.yml']
permissions:
  contents: read
jobs:
  clients:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "sounddevice>=0.5,<0.6" "cryptography>=43,<47"
      - run: python -m unittest discover -s clients/Gestores -v
      - run: python -m unittest discover -s clients/Intercambio-textos -v
      - run: python -m unittest discover -s clients/IA-local -v
      - run: python -m unittest discover -s services -v
      - run: python -m unittest discover -s clients/maintenance -v

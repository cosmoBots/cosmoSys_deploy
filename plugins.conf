# Optional plugins. Every cosmoSys image carries all of them, dormant outside
# plugins/, and an instance activates the options it lists in
# COSMOSYS_PLUGINS (for example COSMOSYS_PLUGINS=kroki,latex). The entrypoint
# of the image copies the plugins of those options into plugins/ before Redmine
# starts, so a dormant plugin is never loaded.
#
# This file is the only place where an optional plugin is declared. It is read
# as KEY=VALUE lines, never executed. docs/optional-plugins.md explains how to
# add a set; move revisions with scripts/update-pins.sh, not by hand.
#
#   COSMOSYS_OPTIONS          options an instance may list, in canonical order
#   COSMOSYS_TOOL_GROUPS      tool groups, in canonical order
#   OPTION_<name>_PLUGINS     plugins the option copies into plugins/
#   OPTION_<name>_TOOLS       tool groups the option needs in the image
#   OPTION_<name>_COMPOSE     overlay with the services the option adds
#   OPTION_<name>_PINS        service image settings pinned per instance
#   OPTION_<name>_VARIANT     required image variant, if any
#   PLUGIN_<id>_SOURCE        public git repository of the plugin
#   PLUGIN_<id>_REVISION      immutable commit of that repository
#   PLUGIN_<id>_SUBDIR        directory of the repository that is the plugin
#   PLUGIN_<id>_LOCAL         directory of this repository that is the plugin
#   PLUGIN_<id>_DIRECTORY     runtime directory when it differs from plugin ID
#   TOOLS_<group>_APT         Debian packages of a tool group
#   TOOLS_<group>_BUNDLE      prebuilt tool bundle in docker/tool-bundles/
#   TOOLS_<group>_PYTHON      Python packages of a tool group, installed in
#                             /opt/cosmosys-python from docker/python/<group>.txt
#
# Tools are the only part that is not in every image: the last build stage
# installs the groups an instance needs (COSMOSYS_TOOLS), so instances without
# LaTeX or notebooks carry none of their packages. Python packages are pinned
# with their hashes in docker/python/<group>.txt, which
# scripts/update-pins.sh --python regenerates from these lists.

COSMOSYS_OPTIONS=adr arch cad kroki latex notebooks poris poris_arch tags
COSMOSYS_TOOL_GROUPS=libredwg mathtext nbconvert

# Architecture Decision Records in cosmoSys: ADRs as items of their own
# tracker, numbered per project, with their lifecycle, a tab of their own and
# references from any cosmoSys text.
OPTION_adr_PLUGINS=cosmosys_adr

# Architecture inherits CAD; its tracker/workflow migration also needs Req.
OPTION_arch_PLUGINS=redmine_cad_preview cosmosys_cad_preview cosmosys_arch
OPTION_arch_TOOLS=libredwg
OPTION_arch_VARIANT=requirements

OPTION_poris_arch_PLUGINS=redmine_cad_preview cosmosys_cad_preview cosmosys_poris cosmosys_arch cosmosys_poris_arch
OPTION_poris_arch_TOOLS=libredwg
OPTION_poris_arch_VARIANT=requirements

# CAD viewer and cosmoSys embedding, named views and static report figures.
# ImageMagick is provided by the Redmine base image; LibreDWG converts DWG.
OPTION_cad_PLUGINS=redmine_cad_preview cosmosys_cad_preview
OPTION_cad_TOOLS=libredwg

# Redmine-Kroki macros, the cosmoSys report-export integration and a settings
# compatibility initializer, plus the private Kroki service stack.
OPTION_kroki_PLUGINS=redmine_kroki redmine_kroki_compat cosmosys_kroki
OPTION_kroki_COMPOSE=compose.kroki.yml
OPTION_kroki_PINS=KROKI_SERVER_IMAGE KROKI_MERMAID_IMAGE KROKI_BPMN_IMAGE KROKI_EXCALIDRAW_IMAGE KROKI_DIAGRAMSNET_IMAGE

# LaTeX macros; matplotlib renders formulas as images for static exports.
OPTION_latex_PLUGINS=redmine_cbots_latex
OPTION_latex_TOOLS=mathtext

# Read-only previews of Jupyter notebooks, converted with nbconvert, whose
# formulas are rendered by the LaTeX plugin.
OPTION_notebooks_PLUGINS=redmine_cbots_latex redmine_notebook_preview
OPTION_notebooks_TOOLS=mathtext nbconvert

# PORIS models in cosmoSys: a project profile with its own item kinds and
# trackers, and the porisViewer, whose browser bundle the plugin carries built.
OPTION_poris_PLUGINS=cosmosys_poris

# Issue and wiki tags, on the additionals library.
OPTION_tags_PLUGINS=additionals additional_tags


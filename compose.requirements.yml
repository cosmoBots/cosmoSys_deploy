x-requirements-image: &requirements-image
  image: ${COSMOSYS_REQ_IMAGE:-cosmobots/cosmosys-req:c387de7-b5d9795-redmine-7.0.1}
  build:
    target: cosmosys_requirements
    args:
      COSMOSYS_REQ_REVISION: ${COSMOSYS_REQ_REVISION:-b5d979573a35cb65abc9ad9b1b6c861c3eb07470}

services:
  migrate:
    <<: *requirements-image

  bootstrap:
    <<: *requirements-image

  redmine:
    <<: *requirements-image

x-requirements-image: &requirements-image
  image: ${COSMOSYS_REQ_IMAGE:-cosmobots/cosmosys-req:965eaf7-6df0fce-redmine-7.0.1}
  build:
    target: cosmosys_requirements
    args:
      COSMOSYS_REQ_REVISION: ${COSMOSYS_REQ_REVISION:-6df0fcedce83f60c04023b9e68e85c9048a2b916}

services:
  migrate:
    <<: *requirements-image

  bootstrap:
    <<: *requirements-image

  redmine:
    <<: *requirements-image

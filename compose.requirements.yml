x-requirements-image: &requirements-image
  image: ${COSMOSYS_REQ_IMAGE:-cosmobots/cosmosys-req:89c8c45-7b57455-redmine-7.0.1}
  build:
    target: cosmosys_requirements
    args:
      COSMOSYS_REQ_REVISION: ${COSMOSYS_REQ_REVISION:-7b57455446ab3ad38fda3dd74eac80dfe82a6137}

services:
  migrate:
    <<: *requirements-image

  bootstrap:
    <<: *requirements-image

  redmine:
    <<: *requirements-image

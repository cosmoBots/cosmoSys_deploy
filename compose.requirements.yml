x-requirements-image: &requirements-image
  image: ${COSMOSYS_REQ_IMAGE:-cosmobots/cosmosys-req:d89ce49-c66d6b5-redmine-7.0.1}
  build:
    target: cosmosys_requirements
    args:
      COSMOSYS_REQ_REVISION: ${COSMOSYS_REQ_REVISION:-c66d6b5bff185d817692e8971a1103e0c23fcec0}

services:
  migrate:
    <<: *requirements-image

  bootstrap:
    <<: *requirements-image

  redmine:
    <<: *requirements-image

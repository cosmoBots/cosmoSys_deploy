name: csys_proxy

services:
  docker-api:
    image: ${COSMOSYS_DOCKER_API_IMAGE:-tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459}
    restart: unless-stopped
    environment:
      # Read-only access to what caddy-docker-proxy needs; POST stays disabled.
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
    volumes:
      - ${COSMOSYS_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - docker-api

  caddy:
    image: ${COSMOSYS_CADDY_IMAGE:-lucaslorentz/caddy-docker-proxy:2.13.1-alpine@sha256:3e6cf4a6382da0cd14108a69929d7f8cc59e9a59cae4c9795071fa392ffa8036}
    restart: unless-stopped
    depends_on:
      - docker-api
    environment:
      DOCKER_HOST: tcp://docker-api:2375
      CADDY_INGRESS_NETWORKS: ${COSMOSYS_PROXY_NETWORK:-caddy_proxy}
    ports:
      - "${COSMOSYS_PROXY_BIND_ADDRESS:-0.0.0.0}:${COSMOSYS_PROXY_HTTP_PORT:-80}:80"
      - "${COSMOSYS_PROXY_BIND_ADDRESS:-0.0.0.0}:${COSMOSYS_PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - data:/data
    networks:
      - proxy
      - docker-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  proxy:
    name: ${COSMOSYS_PROXY_NETWORK:-caddy_proxy}
  docker-api:
    internal: true

volumes:
  data:
